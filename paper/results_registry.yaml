# Registry of the results of the paper pipeline.
# One entry per result. `message` is written by hand after reading the numbers of the run;
# `level` is a proposal (workshop = short paper, journal = extended version) to be decided
# by Mauro and Brian. `tables` are the names produced by step 4 (without extension).
# `status`: done = script exists and has run; todo = planned.

- id: R01
  title: Models and corpus
  level: workshop
  status: done
  script: steps/step2_cluster.py (analysis/run_analysis.py), steps/step4_report.py
  tables: [tab_models_full_k8, tab_models_full_k16]
  question: How do the nine representations (8 embedding models and the TF-IDF baseline) score on the standard metrics?
  message: >
    AMI against WIPO is 0.25-0.34 at K=8 for all models; the TF-IDF baseline is 0.25.
    Models differ more on AMI against office (0.03-0.17) and on seed stability than on WIPO.

- id: R02
  title: Reference scale for the AMI against WIPO
  level: workshop
  status: done
  script: controls/c01_reference_scale.py
  tables: [tab_reference_scale]
  figures: [fig_reference_scale]
  question: What AMI against WIPO can a partition reach, and where do the models sit?
  message: >
    At K=8 the best coarsening of WIPO reaches 0.750, IPC-only K-means 0.314, the models 0.27-0.34
    (36-45% of the ceiling), TF-IDF 0.251. At K=16 IPC-only K-means (0.419) is above every model (max 0.373).
    WIPO is built from IPC, so this reference is partly circular.

- id: R03
  title: Cross-model agreement and noise ceiling
  level: workshop
  status: done
  script: controls/c02_noise_ceiling.py
  tables: [tab_cross_model]
  figures: [fig_cross_model]
  question: How much do models agree, compared with the agreement of K-means with itself across seeds?
  message: >
    Qwen3-4B is the outlier (mean ARI with the others 0.28 at K=8, 0.22 at K=16). Pat-SPECTER and PaECTER are the closest pair (0.68).
    Several models are not stable across seeds at K=8 (gemma 0.80, PaECTER 0.78, mpnet 0.84, TF-IDF 0.84), which limits agreement.

- id: R04
  title: CN as a confounder, removal test
  level: workshop
  status: done
  script: controls/c03_confounder_cn.py
  tables: [tab_confounder_cn]
  figures: [fig_cn_removal]
  question: Does removing CN move the clusters more than removing the same number of patents at random?
  message: >
    Yes for all models. ARI between full clustering and refit at K=8: remove-CN 0.40-0.88, remove-random 0.66-0.98
    (Qwen3-4B 0.65 vs 0.88, SBERT 0.74 vs 0.98, Pat-SPECTER 0.88 vs 0.93). The AMI against WIPO on the same patents
    changes little after refit, so the higher AMI seen when CN is excluded comes mostly from which patents are scored.

- id: R05
  title: AMI against WIPO inside each office
  level: workshop
  status: done
  script: controls/c03_confounder_cn.py
  tables: [tab_within_office]
  question: Does the alignment with WIPO survive inside each office?
  message: >
    Yes: 0.25-0.39 inside every office group. CN is the lowest for all models; the gap to the other offices is largest
    for Qwen3-4B (0.26 vs about 0.35).

- id: R06
  title: Stability of the cluster explanations
  level: workshop
  status: done
  script: controls/c04_explanation_stability.py
  tables: [tab_explanation_stability]
  figures: [fig_explanation_stability]
  question: Do the c-TF-IDF cluster cards stay the same across seeds, cohorts and models?
  message: >
    Across seeds the cards are as stable as the clustering: at K=8 identical (Jaccard 1.0); at K=16 SBERT 0.89-0.96
    (seed ARI 0.97), Qwen3-4B 0.63-0.85 (0.85), Pat-SPECTER 0.48-0.72 (0.69), with the minimum over clusters down to 0-0.18
    for the last two. Across cohorts (full vs exclude-CN) the term Jaccard is 0.13-0.24 at both K, minimum 0, even when
    94% of the patents are kept (Pat-SPECTER, K=8). Across models 0.10-0.24, against 0.003-0.015 for unmatched clusters.
    The Jaccard on the top 10 terms is strict; a comparison of the labels would complement it.

